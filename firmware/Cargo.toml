[package]
name = "n20-servo"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["set-vtor", "set-sp"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "24e2f68a94e3840d4c0fc197addd161fcb71306c", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "24e2f68a94e3840d4c0fc197addd161fcb71306c", features = ["stm32h503kb", "time-driver-any", "unstable-pac"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "24e2f68a94e3840d4c0fc197addd161fcb71306c" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "24e2f68a94e3840d4c0fc197addd161fcb71306c" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "24e2f68a94e3840d4c0fc197addd161fcb71306c" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "24e2f68a94e3840d4c0fc197addd161fcb71306c" }
embedded-hal = "1.0"
rtt-target = "0.6.2"
panic-rtt-target = "0.2.0"
heapless = "0.8"

barefoc = { path = "/home/sun/Filelink/Firmwares/bareFOC/barefoc", default-features = false }
barefoc-drivers = { path = "/home/sun/Filelink/Firmwares/bareFOC/drivers/barefoc-drivers", default-features = false }
barefoc-multibus = { path = "/home/sun/Filelink/Firmwares/bareFOC/drivers/barefoc-multibus", default-features = false, features = ["simplefoc-profile"] }
barefoc-stm32 = { path = "/home/sun/Filelink/Firmwares/bareFOC/barefoc-hal/barefoc-stm32", default-features = false, features = ["stm32h5", "multibus", "katapult"] }
tmag-rs = { path = "/home/sun/Filelink/Firmwares/bareFOC/drivers/tmag-rs", default-features = false, features = ["barefoc"] }

[features]
default = []
bootloader = []

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = false
